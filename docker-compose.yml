# One-command run of the API and the web console: docker compose up --build
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3001
      LOG_LEVEL: info
      CORS_ORIGINS: http://localhost:3000
      API_DOCS_ENABLED: 'true'
      # Only the web container may set X-Forwarded-For. Anything else is rate-limited by its own
      # address, so it cannot pick a limit bucket by sending the header itself.
      TRUST_PROXY: 172.28.0.10
      QUANTITY_DECIMAL_PLACES: 3
      DEFAULT_STOCK_PRICE: 100
      MARKET_TIMEZONE: America/New_York
      MARKET_OPEN_TIME: '09:30'
      MARKET_CLOSE_TIME: '16:00'
    # Reachable from this machine only (for the API docs at http://localhost:3001/docs).
    ports:
      - '127.0.0.1:3001:3001'
    networks:
      - app
    # The order history is in memory and capped, so this leaves plenty of headroom.
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:3001/api/v1
      # Browsers connect straight to the console here, so it has no trusted address to pass on and
      # all console users share one rate limit. Behind a reverse proxy, set this to the number of
      # proxies that append to X-Forwarded-For, and stop publishing port 3000 (or bind it to
      # 127.0.0.1): anyone who can reach the console directly could otherwise set the header.
      TRUSTED_PROXY_COUNT: 0
    ports:
      - '3000:3000'
    networks:
      app:
        ipv4_address: 172.28.0.10
    depends_on:
      api:
        condition: service_healthy

networks:
  app:
    ipam:
      config:
        - subnet: 172.28.0.0/24
          # Addresses handed out automatically, kept clear of the web container's fixed one.
          ip_range: 172.28.0.128/25
